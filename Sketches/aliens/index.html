<style>
:root{
  --text:#171717;
  --muted:#666;
  --line:#d8d8d8;
  --bg:#fff;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text)}
body{
  font-family:Arial,Helvetica,sans-serif;
  line-height:1.5;
}
.wrap{
  width:min(1180px,92vw);
  margin:0 auto;
  padding:24px 0 42px;
}
.top-nav{
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:10px 18px;
  margin:4px 0 34px;
  font-size:14px;
}
.top-nav a{
  color:inherit;
  text-decoration:none;
}
.top-nav a:hover{text-decoration:underline}
.page-header{
  text-align:center;
  margin:0 0 34px;
}
.page-title{
  margin:0;
  font-family:Georgia,'Times New Roman',serif;
  font-size:clamp(34px,5vw,58px);
  font-weight:500;
  letter-spacing:.01em;
}
.gateway-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:34px;
  align-items:start;
  max-width:1050px;
  margin:0 auto 46px;
}
.gateway-card{
  display:block;
  color:inherit;
  text-decoration:none;
  text-align:center;
}
.gateway-image-wrap{
  width:100%;
  aspect-ratio:4/3;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  border:1px solid var(--line);
  background:#fafafa;
}
.gateway-card img{
  width:100%;
  height:100%;
  object-fit:contain;
  display:block;
}
.gateway-label{
  margin-top:14px;
  font-family:Georgia,'Times New Roman',serif;
  font-size:27px;
}
.gateway-card:hover .gateway-label{text-decoration:underline}
footer{
  margin-top:44px;
  padding-top:18px;
  border-top:1px solid var(--line);
  text-align:center;
  color:var(--muted);
  font-size:13px;
}
footer a{color:inherit}
@media(max-width:720px){
  .gateway-grid{grid-template-columns:1fr;gap:28px}
}
</style>
