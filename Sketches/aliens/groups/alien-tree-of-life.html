<html lang="en"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1" name="viewport"/><title>Alien Tree of Life | Ron English Catalogue Raisonné</title><style>
/* Kursed index — single self-contained compact-card stylesheet. */
:root {
  --border: #e5e7eb;
  --muted: #666;
  --image-background: #f8fafc;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: #fff;
  color: #171717;
  font-family: Arial, Helvetica, sans-serif;
  line-height: 1.5;
}

.wrap {
  width: calc(100% - 36px);
  max-width: 700px;
  margin: 0 auto;
  padding: 24px 0 42px;
}

/* Site navigation and catalogue sequence */
.nav-pills,
.sequence-nav {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  align-items: center;
  gap: 10px;
  text-align: center;
}

.nav-pills { margin: 20px 0 28px; }
.sequence-nav { margin: 28px auto 18px; }

.nav-pill {
  display: inline-block;
  padding: 8px 14px;
  border: 1px solid var(--border);
  border-radius: 999px;
  background: #fff;
  color: #111;
  text-decoration: none;
  font: 14px/1.25 system-ui, -apple-system, "Segoe UI", sans-serif;
}

.nav-pill:hover,
.nav-pill:focus-visible { background: #f3f4f6; }

/* Page heading */
.page-header { margin: 0 0 26px; text-align: center; }
.page-title {
  margin: 0;
  font: 500 clamp(30px, 4vw, 46px) Georgia, "Times New Roman", serif;
}

/* Compact artwork-card gallery */
.index-grid {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  align-items: stretch;
  gap: 12px;
  margin: 0 auto;
}

.index-card {
  display: flex;
  flex: 0 0 200px;
  flex-direction: column;
  width: 200px;
  min-width: 0;
  overflow: hidden;
  border: 1px solid var(--border);
  border-radius: 12px;
  background: #fff;
  box-shadow: 0 3px 12px #0000000b;
  color: inherit;
  text-align: center;
  text-decoration: none;
}

.index-card:hover {
  border-color: #c9ced5;
  box-shadow: 0 5px 16px #00000014;
}

.index-image {
  display: flex;
  flex: 0 0 158px;
  justify-content: center;
  align-items: center;
  width: 100%;
  height: 158px;
  padding: 8px;
  border-bottom: 1px solid var(--border);
  background: var(--image-background);
}

.index-image img {
  display: block;
  width: 100%;
  height: 100%;
  max-width: 100%;
  max-height: 100%;
  object-fit: contain;
}

.card-title {
  margin: 0;
  padding: 10px 8px 12px;
  font: 500 14px/1.35 Georgia, "Times New Roman", serif;
  overflow-wrap: anywhere;
}

.set-label {
  display: block;
  margin-top: 4px;
  color: var(--muted);
  font: 400 12px/1.35 Arial, Helvetica, sans-serif;
}

/* Publication footer */
footer {
  margin-top: 35px;
  padding-top: 18px;
  border-top: 1px solid #d8d8d8;
  color: var(--muted);
  font-size: 13px;
  text-align: center;
}

@media (max-width: 480px) {
  .wrap { width: calc(100% - 24px); }
  .index-grid { gap: 12px; }
  .index-card { flex-basis: 145px; width: 145px; }
  .index-image { flex-basis: 140px; height: 140px; }
  .card-title { font-size: 13px; }
}
  
/* Astro Thinker: same card treatment as Kursed, no enclosing artwork panel. */
.group-grid { display:flex; flex-wrap:wrap; justify-content:center; align-items:stretch; gap:12px; margin:0 auto; }
.group-card { display:flex; flex:0 0 200px; width:200px; min-width:0; flex-direction:column; overflow:hidden; border:1px solid var(--border); border-radius:12px; background:#fff; box-shadow:0 3px 12px #0000000b; color:inherit; text-align:center; text-decoration:none; }
.group-card:hover { border-color:#c9ced5; box-shadow:0 5px 16px #00000014; }
.group-card img { display:block; width:100%; height:158px; max-width:100%; object-fit:contain; padding:8px; border-bottom:1px solid var(--border); background:var(--image-background); }
.group-card .label { margin:0; padding:10px 8px 12px; font:500 14px/1.35 Georgia,"Times New Roman",serif; overflow-wrap:anywhere; }
@media (max-width:480px) { .group-grid {gap:12px;} .group-card {flex-basis:145px; width:145px;} .group-card img {height:140px;} .group-card .label {font-size:13px;} }

/* Approved detail-page title scale for set pages */
.page-title {font:500 28px/1.25 Georgia,"Times New Roman",serif;}

/* Owner-requested set grouping panel — V2 pilot. */
section[data-role="index-listing"] {
  width:100%;
  max-width:680px;
  margin:0 auto;
  padding:16px;
  border:1px solid #e5e7eb;
  border-radius:12px;
  background:#fff;
  box-shadow:none;
}
@media (max-width:480px) {
  section[data-role="index-listing"] { padding:12px; }
}

/* Owner-approved V4 compact artwork card geometry, applied to set cards only. */
.group-grid > .group-card {
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
  flex: 0 0 200px;
  width: 200px;
  max-width: 200px;
  height: 204px;
  min-height: 204px;
}
.group-grid > .group-card > img {
  display: block;
  box-sizing: border-box;
  flex: 0 0 158px;
  width: 100%;
  height: 158px;
  min-height: 158px;
  padding: 8px;
  object-fit: contain;
  background: #f8fafc;
  border-bottom: 1px solid #e5e7eb;
}
.group-grid > .group-card > .label {
  box-sizing: border-box;
  display: flex;
  flex: 1 0 44px;
  min-height: 44px;
  align-items: center;
  justify-content: center;
  padding: 2px 5px;
  font: 500 14px/1.3 Georgia, "Times New Roman", serif;
  text-align: center;
  overflow-wrap: anywhere;
}
@media (max-width: 480px) {
  .group-grid > .group-card { flex: 0 0 145px; width: 145px; max-width: 145px; height: 190px; min-height: 190px; }
  .group-grid > .group-card > img { flex-basis: 140px; height: 140px; min-height: 140px; }
  .group-grid > .group-card > .label { flex-basis: 48px; min-height: 48px; font-size: 13px; }
}
